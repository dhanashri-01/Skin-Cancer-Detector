<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DermaVision AI</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./css/w3.css" />
    <link rel="stylesheet" href="./css/app.css" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <!-- Scripts -->
    <script type="text/javascript" src="js/target_classes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script type="text/javascript"
        src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.6.0/chart.min.js"></script>
    <script type="text/javascript" src="js/mobile-net.js"></script>
</head>

<body>

    <!-- Header -->
    <div class="w3-center w3-margin-top">
        <p class="space-letters"></p>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="mobilenet-demo-container">

            <!-- Title -->
            <h1>DermaVision AI</h1>

            <!-- Controls -->
            <div class="demo-wrapper">

                <div class="button-group">
                    <button id="load-button"
                        class="input-button"
                        onclick="loadModel()">
                        Load Model
                    </button>

                    <button id="demo-image-button"
                        class="input-button"
                        onclick="loadDemoImage()">
                        Use Demo Image
                    </button>

                    <label for="select-file-image" class="input-button">
                        Upload Image
                    </label>

                    <input id="select-file-image"
                        type="file"
                        onchange="loadFile(event)"
                        style="display: none" />

                    <!-- Loading Overlay -->
                    <div id="loading-overlay"
                        class="loading-overlay"
                        style="display: none;">
                    </div>

                    <!-- Progress Box -->
                    <div id="progress-box" style="display: none;">
                        <div class="progress-content">
                            <img src="assets/loading.gif" id="demo-load" />
                            <span style="color: white;">
                                Loading Skin Cancer Model...
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Detect Button -->
                <div>
                    <button id="predict-button"
                        class="input-button predict-button"
                        onclick="predButton()">
                        Detect
                    </button>
                </div>

            </div>

            <!-- Output Section -->
            <div class="box-container">
                <div class="demo-output">

                    <!-- Image Preview -->
                    <div id="select-file-box"
                        class="out-box"
                        style="display: none">

                        <img id="test-image"
                            height="300px"
                            width="450px"
                            margin="2px" />
                    </div>

                    <!-- Prediction Output -->
                    <div id="predict-box"
                        class="out-box"
                        style="display: none">

                        <p id="prediction"></p>
                        <br />

                        <p class="predictions-title">
                            <b>Top-3 Detections By Probability</b>
                        </p>

                        <ul id="predict-list"></ul>
                    </div>

                </div>
            </div>

            <!-- Chart Section -->
            <div class="chart-container">
                <div class="chart-box">
                    <canvas id="predChart"></canvas>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
